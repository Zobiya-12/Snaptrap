name: SNAPTRAP CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Deployment is not done here: Koyeb (API) and Cloudflare Pages (frontend)
# both deploy straight from GitHub on push to main.

jobs:
  # ─────────────────────────────────────────────
  # Backend: real tests against a real Postgres
  # backend/tests/  (API + classifier)
  # ─────────────────────────────────────────────
  test-backend:
    name: Test backend (pytest + Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: snaptrap_user
          POSTGRES_PASSWORD: snaptrap2024   # throwaway CI database
          POSTGRES_DB: snaptrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snaptrap_user -d snaptrap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: snaptrap
      DB_USER: snaptrap_user
      DB_PASS: snaptrap2024
      FLASK_SECRET: ci-only-secret-0123456789abcdef0123456789
      NGROK_HOST: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11   # same version as backend/Dockerfile
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: backend
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            -v --tb=short -p no:warnings

  # ─────────────────────────────────────────────
  # Frontend: production build from the repo root
  # (this is what Cloudflare Pages builds)
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts   # skips the ngrok binary download

      - name: Build production bundle
        env:
          REACT_APP_API_URL: http://localhost:5000/api   # must end in /api
          CI: false                                      # CRA turns lint warnings into errors when CI=true
        run: npm run build

  # ─────────────────────────────────────────────
  # server.js smoke test (WebSocket + REST)
  # ─────────────────────────────────────────────
  test-node-server:
    name: Test Node server.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install server dependencies
        run: npm install ws uuid
        # ngrok intentionally skipped — server.js handles MODULE_NOT_FOUND

      - name: Smoke-test server.js
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3

          curl -sf http://localhost:5001/api/stats | grep totalAttacks
          curl -sf http://localhost:5001/api/raid-feed

          curl -sf -X POST http://localhost:5001/api/track-attack \
            -H "Content-Type: application/json" \
            -d '{"ip":"1.2.3.4","attackType":"brute_force","service":"SSH","threat_score":75}'

          TOTAL=$(curl -sf http://localhost:5001/api/stats \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['totalAttacks'])")
          [ "$TOTAL" -gt 0 ] || (echo "Attack was not recorded" && exit 1)

          kill $SERVER_PID
          echo "server.js smoke test passed"

  # ─────────────────────────────────────────────
  # Docker images must still build (nothing is pushed)
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, test-node-server]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (backend/)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build node-server image (server.js)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.node
          push: false
          cache-from: type=gha,scope=node
          cache-to: type=gha,scope=node,mode=max
